<!doctype html>
<html lang="en">
  <head>
    <link href="../../../dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <button id="trigger" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#myOffcanvas">Open</button>
    <div class="offcanvas offcanvas-start" id="myOffcanvas" tabindex="-1">
      <div class="offcanvas-body">Content</div>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <script src="../../../dist/js/bootstrap.bundle.js"></script>
  </body>
</html>
